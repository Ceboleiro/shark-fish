
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shark Finish — Ocean Adventure</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:white;
 font-family:Arial,sans-serif;text-align:center;
 background:radial-gradient(ellipse at top,#075b83,#021626 75%);
 overflow-x:hidden
}
button{
 cursor:pointer;color:white;font:bold 17px Arial;
 padding:14px 22px;border-radius:16px;
 border:1px solid #baf9ff80;
 background:linear-gradient(135deg,#05c2ce,#0871aa);
 box-shadow:0 7px 18px #001c3388;
 touch-action:manipulation
}
button:hover{filter:brightness(1.16)}
button:active{transform:scale(.97)}
.hidden{display:none!important}
#menu{
 position:relative;width:min(95vw,760px);
 height:min(90vh,740px);min-height:560px;
 margin:20px auto;overflow:hidden;
 border-radius:24px;border:2px solid #8beeff;
 box-shadow:0 18px 65px #0009;
 background:#045c83
}
#menuCanvas{
 position:absolute;inset:0;width:100%;height:100%
}
.menuContent{
 position:relative;z-index:1;height:100%;
 display:flex;flex-direction:column;
 align-items:center;justify-content:space-between;
 padding:30px 12px 35px;pointer-events:none
}
.menuContent>*{pointer-events:auto}
.logo{
 font-size:clamp(38px,8vw,76px);
 margin:0;color:#fff;letter-spacing:3px;
 text-shadow:0 5px 0 #073f64,0 0 25px #3de4ff
}
.subtitle{
 margin:8px;color:#c3faff;letter-spacing:5px;
 font-weight:bold;text-shadow:0 2px 5px #003b55
}
.menuButtons{display:grid;gap:12px;width:min(290px,90vw)}
#play{
 background:linear-gradient(135deg,#00d997,#009b96);
 font-size:25px;padding:18px
}
#helpBox{
 max-width:350px;background:#002b46ed;
 padding:15px;border-radius:15px;line-height:1.6;
 margin:10px auto
}
#gameScreen{padding:12px 0 30px}
#gameScreen h1{color:#b5faff;margin:8px}
#score{font-size:23px;font-weight:bold;margin:8px}
.arena{
 display:flex;justify-content:center;
 align-items:center;gap:7px;margin:12px auto
}
#game{
 display:block;width:min(76vw,440px);height:auto;
 border:4px solid #9deeff;border-radius:14px;
 box-shadow:0 0 28px #00ceff77
}
.decor{
 width:44px;height:min(76vw,440px);
 position:relative;overflow:hidden
}
.fish{
 position:absolute;top:var(--y);left:12px;
 width:24px;height:13px;background:var(--c);
 border-radius:55% 65% 60% 55%;
 animation:fishMove 3s ease-in-out infinite alternate;
 animation-delay:var(--delay)
}
.fish:before{
 content:"";position:absolute;left:-10px;top:0;
 border-top:7px solid transparent;
 border-bottom:7px solid transparent;
 border-right:12px solid var(--c)
}
.fish:after{
 content:"";position:absolute;right:5px;top:3px;
 width:3px;height:3px;background:#092c42;border-radius:50%
}
@keyframes fishMove{
 from{transform:translateY(-11px) rotate(-8deg)}
 to{transform:translateY(12px) rotate(8deg)}
}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.controls{
 display:grid;grid-template-columns:repeat(3,65px);
 gap:8px;justify-content:center;margin:16px auto
}
.controls button{padding:12px 0;font-size:23px}
@media(max-width:430px){
 .decor{width:26px}
 .fish{left:4px;scale:.75}
 .arena{gap:2px}
}
</style>
</head>
<body>

<section id="menu">
 <canvas id="menuCanvas" width="760" height="740"></canvas>
 <div class="menuContent">
  <div>
   <h1 class="logo">SHARK FINISH</h1>
   <p class="subtitle">OCEAN ADVENTURE</p>
  </div>
  <div>
   <div class="menuButtons">
    <button id="play" onclick="startGame()">▶ JOGAR</button>
    <button onclick="toggleHelp()">COMO JOGAR</button>
   </div>
   <div id="helpBox" class="hidden">
    Capture os nadadores para ganhar 10 pontos.
    Use as setas ou WASD no computador e os botões no celular.
    Não bata nas paredes nem no próprio corpo!
   </div>
  </div>
 </div>
</section>

<section id="gameScreen" class="hidden">
 <h1>SHARK FINISH</h1>
 <div id="score">Pontos: 0</div>
 <div class="arena">
  <div class="decor" id="leftFish"></div>
  <canvas id="game" width="400" height="400"></canvas>
  <div class="decor" id="rightFish"></div>
 </div>
 <div class="actions">
  <button onclick="restart()">REINICIAR</button>
  <button onclick="backToMenu()">MENU INICIAL</button>
 </div>
 <div class="controls">
  <span></span>
  <button onclick="turn(0,-1)">▲</button>
  <span></span>
  <button onclick="turn(-1,0)">◀</button>
  <button onclick="turn(0,1)">▼</button>
  <button onclick="turn(1,0)">▶</button>
 </div>
</section>

<script>
const menu=document.getElementById("menu");
const gameScreen=document.getElementById("gameScreen");
const mc=document.getElementById("menuCanvas");
const m=mc.getContext("2d");
const gc=document.getElementById("game");
const c=gc.getContext("2d");
const scoreEl=document.getElementById("score");

const size=20;
const cells=20;
let shark=[],human=null;
let dir={x:1,y:0},next={x:1,y:0};
let score=0,playing=false,timer=null;
let message="";

function toggleHelp(){
 document.getElementById("helpBox").classList.toggle("hidden");
}
function startGame(){
 menu.classList.add("hidden");
 gameScreen.classList.remove("hidden");
 restart();
}
function backToMenu(){
 clearInterval(timer);playing=false;
 gameScreen.classList.add("hidden");
 menu.classList.remove("hidden");
}
function decorate(id){
 const el=document.getElementById(id);
 const colors=["#ffcc43","#ff7c9a","#76f5b5","#ffa35b","#bfa0ff"];
 for(let i=0;i<9;i++){
  const f=document.createElement("div");
  f.className="fish";
  f.style.setProperty("--c",colors[i%colors.length]);
  f.style.setProperty("--y",(4+i*10)+"%");
  f.style.setProperty("--delay",(-i*.4)+"s");
  el.appendChild(f);
 }
}
decorate("leftFish");
decorate("rightFish");

function randomHuman(){
 let p;
 do{
  p={x:Math.floor(Math.random()*cells),
     y:Math.floor(Math.random()*cells)};
 }while(shark.some(s=>s.x===p.x&&s.y===p.y));
 return p;
}
function restart(){
 clearInterval(timer);
 shark=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
 dir={x:1,y:0};next={x:1,y:0};
 score=0;playing=true;message="";
 human=randomHuman();
 scoreEl.textContent="Pontos: 0";
 timer=setInterval(update,165);
}
function turn(x,y){
 if(!playing)return;
 if(x===-dir.x&&y===-dir.y)return;
 next={x,y};
}
document.addEventListener("keydown",e=>{
 const keys={
  ArrowUp:[0,-1],ArrowDown:[0,1],
  ArrowLeft:[-1,0],ArrowRight:[1,0],
  w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]
 };
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 if(keys[k]){
  e.preventDefault();
  turn(...keys[k]);
 }
});
function update(){
 if(!playing)return;
 dir={...next};
 const head={x:shark[0].x+dir.x,y:shark[0].y+dir.y};
 const eating=head.x===human.x&&head.y===human.y;
 const body=eating?shark:shark.slice(0,-1);
 const wall=head.x<0||head.x>=cells||head.y<0||head.y>=cells;
 const hit=body.some(s=>s.x===head.x&&s.y===head.y);
 if(wall||hit){
  playing=false;clearInterval(timer);
  message="FIM DE JOGO — "+score+" PONTOS";
  return;
 }
 shark.unshift(head);
 if(eating){
  score+=10;scoreEl.textContent="Pontos: "+score;
  if(shark.length===cells*cells){
   playing=false;clearInterval(timer);message="VOCÊ VENCEU!";
  }else human=randomHuman();
 }else shark.pop();
}

// Utilidades de desenho
function ellipse(ctx,x,y,rx,ry,color,rotation=0){
 ctx.fillStyle=color;ctx.beginPath();
 ctx.ellipse(x,y,rx,ry,rotation,0,Math.PI*2);ctx.fill();
}
function poly(ctx,points,color){
 ctx.fillStyle=color;ctx.beginPath();
 ctx.moveTo(points[0][0],points[0][1]);
 for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);
 ctx.closePath();ctx.fill();
}

// Fundo subaquático pintado por código
function ocean(ctx,w,h,t,detail=true){
 const bg=ctx.createLinearGradient(0,0,0,h);
 bg.addColorStop(0,"#12a9d0");
 bg.addColorStop(.42,"#087eb1");
 bg.addColorStop(1,"#073657");
 ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);

 // Raios de sol
 ctx.save();
 ctx.globalCompositeOperation="screen";
 for(let i=0;i<7;i++){
  const x=w*(i+.4)/7+Math.sin(t*.15+i)*14;
  const grad=ctx.createLinearGradient(x,0,x+70,h);
  grad.addColorStop(0,"#d4ffff55");
  grad.addColorStop(1,"#d4ffff00");
  poly(ctx,[[x-22,0],[x+22,0],[x+145,h],[x+40,h]],grad);
 }
 ctx.restore();

 // Nuvens de tinta aquarelada
 for(let i=0;i<18;i++){
  const x=(i*97+31)%w;
  const y=(i*73+19)%h;
  const r=35+(i%5)*13;
  const g=ctx.createRadialGradient(x,y,2,x,y,r);
  g.addColorStop(0,i%2?"#71e9e810":"#8de4ff13");
  g.addColorStop(1,"#8de4ff00");
  ellipse(ctx,x,y,r,r,g);
 }

 // Montanhas marinhas distantes
 ctx.fillStyle="#07567570";
 ctx.beginPath();ctx.moveTo(0,h);
 for(let x=0;x<=w;x+=8){
  ctx.lineTo(x,h*.78+Math.sin(x/55)*22+Math.sin(x/19)*7);
 }
 ctx.lineTo(w,h);ctx.fill();

 // Fundo arenoso
 ctx.fillStyle="#b2c6a657";
 ctx.beginPath();ctx.moveTo(0,h);
 for(let x=0;x<=w;x+=5)
  ctx.lineTo(x,h*.94+Math.sin(x/32)*7);
 ctx.lineTo(w,h);ctx.fill();

 if(detail){
  // Corais e plantas nas bordas
  for(let side=0;side<2;side++){
   for(let i=0;i<7;i++){
    const x=side===0?12+i*11:w-12-i*11;
    const base=h-8-(i%3)*12;
    const height=28+(i*17)%52;
    ctx.strokeStyle=i%2?"#25b5a1":"#2cc9b7";
    ctx.lineWidth=3+i%3;ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(x,base);
    ctx.quadraticCurveTo(x+Math.sin(t+i)*9,base-height*.55,
      x+Math.sin(t+i)*14,base-height);
    ctx.stroke();
   }
  }
  for(let i=0;i<16;i++){
   const x=(i*71+13)%w;
   const y=h-7-(i%4)*5;
   ellipse(ctx,x,y,6+(i%3)*4,3,
     ["#fc9b89","#ffce87","#9c83ce"][i%3]);
  }
 }

 // Bolhas
 for(let i=0;i<23;i++){
  const x=(i*83+23)%w;
  const y=((i*67-t*19)%h+h)%h;
  ctx.strokeStyle="#e0ffff55";
  ctx.lineWidth=1.3;ctx.beginPath();
  ctx.arc(x,y,2+i%3,0,Math.PI*2);ctx.stroke();
 }
}

// Tubarão ilustrado, sem emoji
function sharkArt(ctx,x,y,scale,angle,t){
 ctx.save();
 ctx.translate(x,y);ctx.rotate(angle);ctx.scale(scale,scale);

 // Sombra suave
 ellipse(ctx,0,7,60,24,"#002e4c50");

 // Cauda
 poly(ctx,[[-48,0],[-88,-35],[-77,-4],[-88,31],[-46,10]],"#176d9b");
 poly(ctx,[[-51,0],[-83,-27],[-70,0]],"#45b3d1");

 // Barbatanas laterais
 poly(ctx,[[-5,10],[-28,39],[16,20]],"#116a99");
 poly(ctx,[[15,8],[35,29],[32,8]],"#1384ac");

 // Corpo principal
 const g=ctx.createLinearGradient(0,-26,0,26);
 g.addColorStop(0,"#75d6eb");
 g.addColorStop(.4,"#239dc5");
 g.addColorStop(1,"#09547e");
 ellipse(ctx,0,0,58,25,g);

 // Nariz pontudo
 poly(ctx,[[36,-17],[76,1],[37,17]],"#2c9cc1");

 // Barriga branca
 ctx.fillStyle="#e5f8f5";
 ctx.beginPath();
 ctx.moveTo(-42,9);
 ctx.quadraticCurveTo(0,35,55,12);
 ctx.quadraticCurveTo(25,24,-42,9);
 ctx.fill();

 // Barbatana dorsal
 poly(ctx,[[-18,-17],[-4,-55],[21,-18]],"#177ca7");
 poly(ctx,[[-9,-20],[-3,-44],[12,-20]],"#55c3d6");

 // Brilho do corpo
 ctx.strokeStyle="#bafaff65";
 ctx.lineWidth=3;ctx.beginPath();
 ctx.moveTo(-37,-11);
 ctx.quadraticCurveTo(4,-29,40,-11);
 ctx.stroke();

 // Olho
 ellipse(ctx,45,-7,5,5,"#efffff");
 ellipse(ctx,46,-7,2.7,3,"#07263e");
 ellipse(ctx,47,-8,1,1,"#ffffff");

 // Boca
 ctx.strokeStyle="#08354e";
 ctx.lineWidth=2.3;ctx.beginPath();
 ctx.moveTo(46,9);ctx.quadraticCurveTo(61,17,71,8);ctx.stroke();

 // Dentes
 for(let i=0;i<4;i++){
  const px=49+i*6;
  poly(ctx,[[px,12],[px+3,18],[px+5,12]],"#ffffff");
 }

 // Guelras
 ctx.strokeStyle="#0d6489";
 ctx.lineWidth=2;
 for(let i=0;i<3;i++){
  ctx.beginPath();
  ctx.moveTo(23-i*7,-5);
  ctx.lineTo(21-i*7,8);
  ctx.stroke();
 }
 ctx.restore();
}

// Peixe ilustrado
function littleFish(ctx,x,y,s,color,flip=1){
 ctx.save();ctx.translate(x,y);ctx.scale(s*flip,s);
 poly(ctx,[[-8,0],[-19,-9],[-19,9]],color);
 ellipse(ctx,0,0,12,7,color);
 poly(ctx,[[-3,-5],[3,-12],[8,-4]],color);
 ellipse(ctx,7,-2,1.8,1.8,"#062d46");
 ctx.restore();
}

// Nadador desenhado
function swimmer(ctx,x,y,s,t){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.rotate(Math.sin(t*4)*.12);
 ctx.lineCap="round";
 ctx.strokeStyle="#f1b88f";ctx.lineWidth=4;
 ctx.beginPath();
 ctx.moveTo(-6,0);ctx.lineTo(-13,5);
 ctx.moveTo(6,0);ctx.lineTo(13,5);
 ctx.moveTo(-3,9);ctx.lineTo(-6,16);
 ctx.moveTo(3,9);ctx.lineTo(6,16);
 ctx.stroke();
 ellipse(ctx,0,4,8,10,"#ff547b");
 ellipse(ctx,0,-9,8,8,"#f4c59f");
 ctx.fillStyle="#4b342e";ctx.beginPath();
 ctx.arc(0,-12,8,Math.PI,Math.PI*2);ctx.fill();
 ctx.restore();
}

// Tela inicial
function drawMenu(t){
 const w=mc.width,h=mc.height;
 ocean(m,w,h,t,true);

 // Plantas e peixes decorativos
 for(let i=0;i<13;i++){
  const x=(i*97+45)%w;
  const y=205+(i*63)%(h-260);
  littleFish(m,x+Math.sin(t+i)*15,y,
    .8+i%3*.3,
    ["#ffd36a","#ff8eaa","#a7f8b4","#b8a6ff"][i%4],
    i%2?1:-1);
 }

 // Tubarão principal grande
 sharkArt(m,w*.49+Math.sin(t*.8)*20,h*.49+
   Math.cos(t*.7)*10,2.25,Math.sin(t*.4)*.05,t);

 // Vinheta
 const v=m.createRadialGradient(w/2,h/2,100,w/2,h/2,540);
 v.addColorStop(0,"#00162b00");
 v.addColorStop(1,"#00162b99");
 m.fillStyle=v;m.fillRect(0,0,w,h);
}

// Tubarão do jogo
function drawPlayer(){
 shark.forEach((part,i)=>{
  const x=part.x*size+10;
  const y=part.y*size+10;
  if(i===0){
   sharkArt(c,x,y,.105,Math.atan2(dir.y,dir.x),
     performance.now()/1000);
  }else{
   ellipse(c,x,y,9,7,"#168db6");
   ellipse(c,x,y-2,6,3,"#52c8df");
  }
 });
}
function drawGame(t){
 ocean(c,400,400,t,true);
 if(human)swimmer(c,human.x*size+10,
   human.y*size+10,.55,t);
 drawPlayer();
 if(!playing&&message){
  c.fillStyle="#00243bdb";
  c.fillRect(0,151,400,98);
  c.fillStyle="#fff";
  c.textAlign="center";
  c.textBaseline="middle";
  c.font="bold 18px Arial";
  c.fillText(message,200,200);
 }
}
function frame(ms){
 const t=ms/1000;
 if(!menu.classList.contains("hidden"))drawMenu(t);
 if(!gameScreen.classList.contains("hidden"))drawGame(t);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
